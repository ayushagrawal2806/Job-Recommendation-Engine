spring.application.name=JobRecommendationEngine
spring.datasource.url=jdbc:postgresql://localhost:5432/job_match
spring.datasource.username=jobmatch_user
spring.datasource.password=jobmatch_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
server.servlet.context-path=/api